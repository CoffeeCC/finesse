name: CI

# Every pull request: type-check and test the server, and build the web and TV apps.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server — types and tests
        run: |
          npm run server:typecheck
          npm run server:test
      - name: Web app
        run: npm run build
      - name: TV app
        run: npm run build:webos
      - name: Server bundle
        run: npm run server:build
      - name: Installer syntax
        run: bash -n install.sh

  # The game-store install sandbox (docker/installer/). Pushing it is a release
  # (release.yml); the catalog pins the version tag, and a digest pin is a release decision.
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the install sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/installer/Dockerfile
          push: false
          tags: finesse-installer:ci
          cache-from: type=gha,scope=installer
          cache-to: type=gha,mode=max,scope=installer
